version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    # "/" only covers .github/workflows; composite actions need their own directories.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
